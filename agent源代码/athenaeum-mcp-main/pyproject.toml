[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athenaeum-mcp"
version = "0.1.0"
description = "Athenaeum: a unified, 100% free Model Context Protocol server for academic research — meta-search, metadata, citations, citation-graph traversal, source validation, PDF full-text reading, Zotero export and bibliography generation across OpenAlex, Crossref, arXiv, Europe PMC, PubMed, DBLP, OpenCitations, bioRxiv/medRxiv, CORE, Semantic Scholar, Unpaywall and DOAJ."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Athenaeum contributors" }]
keywords = ["mcp", "academic", "research", "openalex", "crossref", "arxiv", "pubmed", "dblp", "opencitations", "citations", "bibliography", "literature-review", "zotero"]

dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "feedparser>=6.0.11",
    "rapidfuzz>=3.6.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
athenaeum-mcp = "athenaeum_mcp.server:main"
athenaeum-setup = "athenaeum_mcp.configurator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athenaeum_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit live external APIs (deselect with -m 'not live')",
]
